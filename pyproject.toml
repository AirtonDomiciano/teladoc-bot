[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teladoc-bot"
version = "0.1.0"
description = "Bot de terminal para documentar telas CRUD no Azure DevOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5"]

[project.scripts]
teladoc-bot = "teladoc_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
